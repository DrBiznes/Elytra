plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Exact public releases for Minecraft 1.21.1.
    // Create is an optional dependency. Pass -PnoCreate (e.g. `gradlew runClient -PnoCreate`)
    // to launch without it and exercise the vanilla crafting-table recipe path.
    if (!project.hasProperty('noCreate')) {
        localRuntime 'curse.maven:create-328085:7963363'
    }
    localRuntime 'curse.maven:waystones-245755:8873000'
    localRuntime 'curse.maven:balm-531761:8645517'
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neo_version             : neo_version,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            create_version          : create_version,
            waystones_version       : waystones_version,
            balm_version            : balm_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('validateResources') {
    group = 'verification'
    description = 'Parses every JSON resource and checks recipe replacement coverage.'
    notCompatibleWithConfigurationCache('Resource validation intentionally scans the checked-in resource tree.')
    doLast {
        def jsonSlurper = new groovy.json.JsonSlurper()
        def jsonFiles = fileTree('src/main/resources') { include '**/*.json' }.files
        jsonFiles.each { jsonSlurper.parse(it) }

        // Every original Waystones recipe is disabled with a neoforge:false condition ...
        def disabledDir = file('src/main/resources/data/waystones/recipe')
        def disabled = fileTree(disabledDir) { include '*.json' }.files
        if (disabled.size() < 50) {
            throw new GradleException("Expected at least 50 disabled original Waystones recipes, found ${disabled.size()}")
        }
        disabled.each { f ->
            def conditions = jsonSlurper.parse(f)['neoforge:conditions']
            if (conditions?.size() != 1 || conditions[0].type != 'neoforge:false') {
                throw new GradleException("${f.name} must disable the original recipe with a single neoforge:false condition")
            }
        }

        // ... and recreated under original/, with a create/ and a vanilla/ replacement for every family.
        def recipeRoot = file('src/main/resources/data/waystone_wings/recipe')
        def styleFiles = { String style ->
            def dir = new File(recipeRoot, style)
            fileTree(dir) { include '**/*.json' }.files.collectEntries {
                [(dir.toPath().relativize(it.toPath()).toString().replace('\\', '/')): it]
            }
        }
        def sets = [create: styleFiles('create'), vanilla: styleFiles('vanilla'), original: styleFiles('original')]

        // Ground truth for which waystones: items actually exist: whatever the recreated
        // original recipes produce (they mirror the real Waystones mod's recipe list exactly).
        def waystonesItemIds = sets.original.values().collect { f ->
            jsonSlurper.parse(f).result.id
        } as Set

        def disabledNames = disabled.collect { it.name } as Set
        def originalNames = sets.original.keySet()
        if (originalNames != disabledNames) {
            throw new GradleException("original/ must mirror the disabled Waystones recipes. Missing: ${disabledNames - originalNames}. Extra: ${originalNames - disabledNames}")
        }
        // Toggleable families have both a Create and a vanilla recipe. Non-toggleable families
        // (a single deploying/compacting step wasn't worth a machine) only ever have a vanilla one.
        def toggleableFamilies = ['calibrated_warp_core', 'waystone', 'waystone_variants', 'warp_plate',
                        'warp_stone', 'blank_scroll', 'warp_dust', 'dormant_shard', 'deepslate_shard'] as Set
        def vanillaOnlyFamilies = ['portstones', 'sharestones', 'warp_scroll', 'return_scroll', 'portal_scroll',
                        'twinbound_feather', 'epitaph'] as Set
        def families = toggleableFamilies + vanillaOnlyFamilies

        // Every create/ file must have a vanilla/ file at the same path, and vice versa: every
        // vanilla/ file for a toggleable family must have a matching create/ file. vanilla/ files
        // for non-toggleable families have no create/ counterpart at all.
        def vanillaToggleablePaths = sets.vanilla.findAll { path, f ->
            toggleableFamilies.contains(jsonSlurper.parse(f)['neoforge:conditions'][0].recipe)
        }.keySet()
        if (sets.create.keySet() != vanillaToggleablePaths) {
            throw new GradleException("create/ and the toggleable-family files under vanilla/ must contain the same recipe paths. " +
                    "Missing vanilla: ${sets.create.keySet() - vanillaToggleablePaths}. Missing create: ${vanillaToggleablePaths - sets.create.keySet()}")
        }

        sets.each { style, files ->
            files.each { path, f ->
                def recipe = jsonSlurper.parse(f)
                def conditions = recipe['neoforge:conditions']
                if (conditions?.size() != 1 || conditions[0].type != 'waystone_wings:recipe_config') {
                    throw new GradleException("${style}/${path} must carry exactly one waystone_wings:recipe_config condition")
                }
                def family = conditions[0].recipe
                if (!families.contains(family)) {
                    throw new GradleException("${style}/${path} references unknown recipe family '${family}'")
                }
                if (style != 'original' && !toggleableFamilies.contains(family) && style != 'vanilla') {
                    throw new GradleException("${style}/${path}: family '${family}' is not toggleable and must only appear under vanilla/")
                }
                if (conditions[0].style != style) {
                    throw new GradleException("${style}/${path} declares style '${conditions[0].style}' but lives in ${style}/")
                }
                def expectedNamespace = style == 'create' ? 'create:' : 'minecraft:'
                if (!recipe.type.startsWith(expectedNamespace)) {
                    throw new GradleException("${style}/${path} has recipe type '${recipe.type}', expected a ${expectedNamespace} recipe")
                }
                // Every produced waystones: item must be one the original mod actually registers.
                // (Waystones ships 16 Portstone colours but only 15 Sharestones -- no white_sharestone --
                // so this catches copy/paste colour-list mistakes rather than assuming symmetry.)
                def resultIds = (recipe.results ?: (recipe.result ? [recipe.result] : []))*.id
                resultIds.findAll { it?.startsWith('waystones:') }.each { id ->
                    if (!waystonesItemIds.contains(id)) {
                        throw new GradleException("${style}/${path} produces '${id}', which is not a real waystones: item " +
                                "(known items come from the original/ recreations)")
                    }
                }
            }
        }
        // Every registered item needs its own model, and every model's texture must exist on disk.
        // The transitional sequenced-assembly items are only distinguishable on a Create depot if
        // each one resolves to a real, distinct texture file.
        def assets = file('src/main/resources/assets/waystone_wings')
        def modelDir = new File(assets, 'models/item')
        def textureDir = new File(assets, 'textures/item')
        def itemsSource = file('src/main/java/dev/jamfemino/waystonewings/registry/ModItems.java').text
        def registeredItems = (itemsSource =~ /simple\("([a-z0-9_]+)"\)/).collect { it[1] }
        if (registeredItems.isEmpty()) {
            throw new GradleException("Could not parse any registered items out of ModItems.java")
        }
        def usedTextures = [:].withDefault { [] }
        registeredItems.each { itemName ->
            def model = new File(modelDir, "${itemName}.json")
            if (!model.exists()) {
                throw new GradleException("Registered item '${itemName}' has no model at models/item/${itemName}.json")
            }
            def layer0 = jsonSlurper.parse(model).textures?.layer0
            if (!layer0) {
                throw new GradleException("models/item/${itemName}.json resolves to no layer0 texture")
            }
            def texturePath = layer0.replace('waystone_wings:item/', '')
            if (!new File(textureDir, "${texturePath}.png").exists()) {
                throw new GradleException("models/item/${itemName}.json references missing texture textures/item/${texturePath}.png")
            }
            usedTextures[texturePath] << itemName
        }
        def shared = usedTextures.findAll { tex, items -> items.size() > 1 }
        if (shared) {
            throw new GradleException("Each item needs its own texture so assembly stages are tellable apart. Shared: " +
                    shared.collect { tex, items -> "${tex}.png used by ${items}" }.join('; '))
        }

        logger.lifecycle("Validated ${jsonFiles.size()} JSON resources: ${disabled.size()} disabled Waystones recipes, " +
                "${sets.create.size()} Create recipes, ${sets.vanilla.size()} vanilla recipes, ${sets.original.size()} original recreations, " +
                "${registeredItems.size()} items with distinct textures.")
    }
}

tasks.named('check').configure { dependsOn tasks.named('validateResources') }

idea.module {
    downloadSources = true
    downloadJavadoc = true
}

publishing {
    publications {
        register('mavenJava', MavenPublication) { from components.java }
    }
}
