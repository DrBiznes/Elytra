modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="icon.png"
authors="Jam Femino"
displayURL="https://github.com/DrBiznes/Elytra"
issueTrackerURL="https://github.com/DrBiznes/Elytra/issues"
description='''
Turns the Elytra into a Waystones progression component and rebuilds Waystones recipes around Create machinery, or the vanilla crafting table when Create is not installed.
'''

[[mixins]]
config="waystone_wings.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="create"
type="optional"
versionRange="[${create_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="waystones"
type="required"
versionRange="[${waystones_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="balm"
type="required"
versionRange="[${balm_version},)"
ordering="AFTER"
side="BOTH"
